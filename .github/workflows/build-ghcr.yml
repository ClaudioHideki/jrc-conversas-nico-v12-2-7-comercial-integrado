name: Build JRC Conversas NICO Platform

on:
  push:
    branches:
      - main
      - codex/nico-v12-2-9-json-execucao
      - codex/nico-platform-refactor
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: 4.16.2-jrc-nico-platform-20260914

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            image: claudiohideki/jrc-conversas-nico-v12-2-7-comercial-integrado
            dockerfile: ./docker/Dockerfile
          - component: nico-runtime
            image: claudiohideki/jrc-conversas-nico-v12-2-7-comercial-integrado-nico-runtime
            dockerfile: ./docker/nico-runtime.Dockerfile

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-

      - name: Construir e publicar ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          provenance: false
