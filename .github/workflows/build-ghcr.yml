name: Build JRC Conversas, Flows e Broker

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar as imagens desta revisão no GHCR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
            image: claudiohideki/jrc-conversas-nico-v12-2-7-comercial-integrado
            dockerfile: ./docker/Dockerfile
            context: .
          - component: nico-runtime
            image: claudiohideki/jrc-conversas-nico-v12-2-7-comercial-integrado-nico-runtime
            dockerfile: ./docker/nico-runtime.Dockerfile
            context: .
          - component: flows-sandbox
            image: claudiohideki/jrc-conversas-nico-v12-2-7-comercial-integrado-flows-sandbox
            dockerfile: ./services/flows-sandbox/Dockerfile
            context: ./services/flows-sandbox

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Construir e publicar ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
          provenance: false
